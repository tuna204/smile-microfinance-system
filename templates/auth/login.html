{% extends "base.html" %}
{% block title %}Log In — Smile Cooperative{% endblock %}
{% block content %}
<h2>Welcome back, partner</h2>
<form method="POST">
  <label>Email or Membership ID<input type="text" name="identifier" required></label>
  <label>Password<input type="password" name="password" required></label>
  <button type="submit">Log In</button>
</form>
<p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
